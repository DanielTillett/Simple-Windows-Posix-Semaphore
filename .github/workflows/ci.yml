name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  msvc:
    name: MSVC ${{ matrix.arch }} (${{ matrix.toolset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
        toolset: [v143, ClangCL]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }} -T ${{ matrix.toolset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  mingw:
    name: MinGW-w64 ${{ matrix.sys }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        sys: [UCRT64, MINGW32]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          pacboy: >-
            cc:p
            cmake:p
            ninja:p
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
